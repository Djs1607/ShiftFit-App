<!-- @dsCard group="Colors" viewport="700x170" name="Shift phase" subtitle="Fixed rota colours. Cool = daylight, deep = night, amber = swing." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-base);color:var(--text-body)}body{padding:20px}
.lbl{font:var(--fw-semibold) var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-feature-settings:var(--font-numeric-feature)}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.wm{font-family:var(--font-display);font-weight:700;letter-spacing:-0.03em;color:var(--text-primary)}
.wm i{font-style:normal;color:var(--sf-amber-500)}
</style></head><body><div class="row"><div class="col" style="flex:1;gap:6px"><div style="height:48px;border-radius:4px;background:var(--sf-shift-day)"></div><span class="lbl">Day</span></div><div class="col" style="flex:1;gap:6px"><div style="height:48px;border-radius:4px;background:var(--sf-shift-swing)"></div><span class="lbl">Swing</span></div><div class="col" style="flex:1;gap:6px"><div style="height:48px;border-radius:4px;background:var(--sf-shift-night)"></div><span class="lbl">Night</span></div><div class="col" style="flex:1;gap:6px"><div style="height:48px;border-radius:4px;background:var(--sf-shift-off)"></div><span class="lbl">Rest</span></div></div>
<div class="lbl" style="margin-top:12px">Never recolour a rota cell by fatigue — phase and load are separate channels.</div></body></html>
