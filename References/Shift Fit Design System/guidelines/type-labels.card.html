<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-base);color:var(--text-body)}body{padding:20px}
.lbl{font:var(--fw-semibold) var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-feature-settings:var(--font-numeric-feature)}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.wm{font-family:var(--font-display);font-weight:700;letter-spacing:-0.03em;color:var(--text-primary)}
.wm i{font-style:normal;color:var(--sf-amber-500)}
</style></head><body><div class="col" style="gap:16px">
<div><span style="font:600 11px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--text-tertiary)">Night 3 of 4</span><div class="lbl" style="margin-top:6px;letter-spacing:0;text-transform:none">Eyebrow · 11/600 · 0.14em</div></div>
<div><span style="font:600 12px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary)">Weekly tonnage</span><div class="lbl" style="margin-top:6px;letter-spacing:0;text-transform:none">Field / metric label · 12/600 · 0.06em</div></div>
<div><span style="font:600 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--sf-amber-400)">Elevated</span><div class="lbl" style="margin-top:6px;letter-spacing:0;text-transform:none">Badge · 11/600 · tone colour</div></div>
</div></body></html>
