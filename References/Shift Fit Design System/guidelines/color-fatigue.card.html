<!-- @dsCard group="Colors" viewport="700x170" name="Fatigue scale" subtitle="Green → amber → red. The only place hue means severity." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-base);color:var(--text-body)}body{padding:20px}
.lbl{font:var(--fw-semibold) var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-feature-settings:var(--font-numeric-feature)}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.wm{font-family:var(--font-display);font-weight:700;letter-spacing:-0.03em;color:var(--text-primary)}
.wm i{font-style:normal;color:var(--sf-amber-500)}
</style></head><body><div class="row" style="gap:0;border-radius:8px;overflow:hidden"><div style="flex:1;height:64px;background:var(--sf-fatigue-1);display:flex;flex-direction:column;justify-content:center;padding:0 10px"><span style="font:var(--fw-bold) 15px/1 var(--font-mono);color:var(--sf-ink-950)">1</span><span style="font:var(--fw-semibold) 10px/1.4 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:rgba(9,13,18,.7)">Fresh</span></div><div style="flex:1;height:64px;background:var(--sf-fatigue-2);display:flex;flex-direction:column;justify-content:center;padding:0 10px"><span style="font:var(--fw-bold) 15px/1 var(--font-mono);color:var(--sf-ink-950)">2</span><span style="font:var(--fw-semibold) 10px/1.4 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:rgba(9,13,18,.7)">Ready</span></div><div style="flex:1;height:64px;background:var(--sf-fatigue-3);display:flex;flex-direction:column;justify-content:center;padding:0 10px"><span style="font:var(--fw-bold) 15px/1 var(--font-mono);color:var(--sf-ink-950)">3</span><span style="font:var(--fw-semibold) 10px/1.4 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:rgba(9,13,18,.7)">Elevated</span></div><div style="flex:1;height:64px;background:var(--sf-fatigue-4);display:flex;flex-direction:column;justify-content:center;padding:0 10px"><span style="font:var(--fw-bold) 15px/1 var(--font-mono);color:var(--sf-ink-950)">4</span><span style="font:var(--fw-semibold) 10px/1.4 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:rgba(9,13,18,.7)">High</span></div><div style="flex:1;height:64px;background:var(--sf-fatigue-5);display:flex;flex-direction:column;justify-content:center;padding:0 10px"><span style="font:var(--fw-bold) 15px/1 var(--font-mono);color:var(--sf-ink-950)">5</span><span style="font:var(--fw-semibold) 10px/1.4 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:rgba(9,13,18,.7)">Critical</span></div></div>
<div class="lbl" style="margin-top:10px">Score bands: 0–20 · 21–40 · 41–65 · 66–85 · 86–100</div></body></html>
