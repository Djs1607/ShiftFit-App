<!-- @dsCard group="Motion" viewport="700x200" name="Timing & easing" subtitle="Instrument, not toy: mechanical easing, no bounce, no overshoot." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-base);color:var(--text-body)}body{padding:20px}
.lbl{font:var(--fw-semibold) var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-feature-settings:var(--font-numeric-feature)}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.wm{font-family:var(--font-display);font-weight:700;letter-spacing:-0.03em;color:var(--text-primary)}
.wm i{font-style:normal;color:var(--sf-amber-500)}
.bar{height:8px;border-radius:999px;background:var(--action-primary);animation:slide 2.6s infinite}
@keyframes slide{0%,8%{transform:translateX(0)}50%,58%{transform:translateX(220px)}100%{transform:translateX(0)}}</style></head><body><div class="col" style="gap:14px">
<div style="display:flex;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--text-primary);width:76px">80 instant</span><div style="flex:1;height:2px;background:var(--data-grid)"></div><span style="font:400 12px/1 var(--font-body);color:var(--text-tertiary);width:190px">tap feedback</span></div><div style="display:flex;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--text-primary);width:76px">140 fast</span><div style="flex:1;height:2px;background:var(--data-grid)"></div><span style="font:400 12px/1 var(--font-body);color:var(--text-tertiary);width:190px">hover, colour</span></div><div style="display:flex;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--text-primary);width:76px">220 base</span><div style="flex:1;height:2px;background:var(--data-grid)"></div><span style="font:400 12px/1 var(--font-body);color:var(--text-tertiary);width:190px">toggles, toasts</span></div><div style="display:flex;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--text-primary);width:76px">320 slow</span><div style="flex:1;height:2px;background:var(--data-grid)"></div><span style="font:400 12px/1 var(--font-body);color:var(--text-tertiary);width:190px">progress fills</span></div><div style="display:flex;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--text-primary);width:76px">420 sheet</span><div style="flex:1;height:2px;background:var(--data-grid)"></div><span style="font:400 12px/1 var(--font-body);color:var(--text-tertiary);width:190px">bottom sheets</span></div><div style="display:flex;gap:14px;align-items:center"><span class="mono" style="font-size:11px;color:var(--text-primary);width:76px">900 meter</span><div style="flex:1;height:2px;background:var(--data-grid)"></div><span style="font:400 12px/1 var(--font-body);color:var(--text-tertiary);width:190px">gauge/needle on entry</span></div>
<div class="lbl" style="margin-top:4px">ease-standard (.2,0,0,1) · ease-out (.16,1,.3,1) · ease-mechanical (.5,0,.2,1)</div>
</div></body></html>
