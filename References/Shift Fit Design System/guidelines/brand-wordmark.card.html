<!-- @dsCard group="Brand" viewport="700x150" name="Wordmark" subtitle="Space Grotesk 700, −0.03em. “Fit” always amber; one word, no space." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-base);color:var(--text-body)}body{padding:20px}
.lbl{font:var(--fw-semibold) var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-feature-settings:var(--font-numeric-feature)}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.wm{font-family:var(--font-display);font-weight:700;letter-spacing:-0.03em;color:var(--text-primary)}
.wm i{font-style:normal;color:var(--sf-amber-500)}
</style></head><body><div style="display:flex;align-items:center;gap:40px;height:110px">
<span class="wm" style="font-size:40px">Shift<i>Fit</i></span>
<div class="col" style="gap:4px">
<span class="wm" style="font-size:20px;color:var(--sf-ink-100)">Shift<span style="color:var(--sf-ink-100)">Fit</span></span><span class="lbl">Mono-tone (1-colour print)</span>
<span class="wm" style="font-size:20px;color:var(--bg-base);background:var(--sf-amber-500);padding:2px 8px;border-radius:4px;width:fit-content">ShiftFit</span><span class="lbl">Knockout on amber</span>
</div></div></body></html>
