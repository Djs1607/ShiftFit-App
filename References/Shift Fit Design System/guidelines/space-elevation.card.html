<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-base);color:var(--text-body)}body{padding:20px}
.lbl{font:var(--fw-semibold) var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-feature-settings:var(--font-numeric-feature)}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.wm{font-family:var(--font-display);font-weight:700;letter-spacing:-0.03em;color:var(--text-primary)}
.wm i{font-style:normal;color:var(--sf-amber-500)}
</style></head><body><div class="row" style="gap:18px"><div class="col" style="flex:1;gap:8px;align-items:center"><div style="width:100%;height:62px;border-radius:12px;background:var(--surface-raised);border:1px solid var(--border-subtle);box-shadow:var(--shadow-sm)"></div><span class="lbl">shadow-sm</span><span style="font:400 11px/1 var(--font-body);color:var(--text-tertiary)">cards</span></div><div class="col" style="flex:1;gap:8px;align-items:center"><div style="width:100%;height:62px;border-radius:12px;background:var(--surface-raised);border:1px solid var(--border-subtle);box-shadow:var(--shadow-md)"></div><span class="lbl">shadow-md</span><span style="font:400 11px/1 var(--font-body);color:var(--text-tertiary)">tooltips</span></div><div class="col" style="flex:1;gap:8px;align-items:center"><div style="width:100%;height:62px;border-radius:12px;background:var(--surface-raised);border:1px solid var(--border-subtle);box-shadow:var(--shadow-lg)"></div><span class="lbl">shadow-lg</span><span style="font:400 11px/1 var(--font-body);color:var(--text-tertiary)">dialogs</span></div><div class="col" style="flex:1;gap:8px;align-items:center"><div style="width:100%;height:62px;border-radius:12px;background:var(--surface-raised);border:1px solid var(--border-subtle);box-shadow:var(--glow-accent)"></div><span class="lbl">glow-accent</span><span style="font:400 11px/1 var(--font-body);color:var(--text-tertiary)">live timer</span></div></div></body></html>
