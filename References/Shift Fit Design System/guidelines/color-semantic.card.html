<!-- @dsCard group="Colors" viewport="700x170" name="Feedback" subtitle="Solid hue for the glyph/border, 14% tint for the fill." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-base);color:var(--text-body)}body{padding:20px}
.lbl{font:var(--fw-semibold) var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-feature-settings:var(--font-numeric-feature)}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.wm{font-family:var(--font-display);font-weight:700;letter-spacing:-0.03em;color:var(--text-primary)}
.wm i{font-style:normal;color:var(--sf-amber-500)}
</style></head><body><div class="row"><div class="col" style="flex:1;gap:6px"><div style="height:44px;border-radius:8px;background:var(--feedback-success-quiet);border:1px solid var(--feedback-success);display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--feedback-success)"></span></div><span class="lbl">Success</span></div><div class="col" style="flex:1;gap:6px"><div style="height:44px;border-radius:8px;background:var(--feedback-warning-quiet);border:1px solid var(--feedback-warning);display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--feedback-warning)"></span></div><span class="lbl">Warning</span></div><div class="col" style="flex:1;gap:6px"><div style="height:44px;border-radius:8px;background:var(--feedback-danger-quiet);border:1px solid var(--feedback-danger);display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--feedback-danger)"></span></div><span class="lbl">Danger</span></div><div class="col" style="flex:1;gap:6px"><div style="height:44px;border-radius:8px;background:var(--feedback-info-quiet);border:1px solid var(--feedback-info);display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--feedback-info)"></span></div><span class="lbl">Info</span></div></div></body></html>
