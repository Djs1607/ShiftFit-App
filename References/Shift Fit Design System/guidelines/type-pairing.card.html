<!-- @dsCard group="Type" viewport="700x230" name="Pairing in use" subtitle="Grotesk headline, Inter sentence, Mono number — never mix roles." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-base);color:var(--text-body)}body{padding:20px}
.lbl{font:var(--fw-semibold) var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-feature-settings:var(--font-numeric-feature)}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.wm{font-family:var(--font-display);font-weight:700;letter-spacing:-0.03em;color:var(--text-primary)}
.wm i{font-style:normal;color:var(--sf-amber-500)}
</style></head><body><div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:14px;padding:20px;max-width:420px">
<span style="font:600 11px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--text-tertiary)">Night 3 of 4</span>
<h3 style="margin:8px 0 0;font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:-0.02em;color:var(--text-primary)">Keep it to technique</h3>
<p style="margin:8px 0 16px;font:400 15px/1.45 var(--font-body);color:var(--text-secondary)">Your readiness has dropped for the third day running. Light loads, full rest.</p>
<div style="display:flex;gap:28px">
<div class="col" style="gap:4px"><span class="lbl">Readiness</span><span class="mono" style="font-size:34px;font-weight:500;line-height:1;color:var(--text-primary)">62</span></div>
<div class="col" style="gap:4px"><span class="lbl">Sleep debt</span><span class="mono" style="font-size:34px;font-weight:500;line-height:1;color:var(--text-primary)">4.2<span style="font-size:13px;color:var(--text-tertiary)"> h</span></span></div>
</div></div></body></html>
