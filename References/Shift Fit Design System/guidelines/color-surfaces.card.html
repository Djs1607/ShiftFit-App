<!-- @dsCard group="Colors" viewport="700x200" name="Surface stack" subtitle="Depth is surface value plus a hairline — not shadow." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-base);color:var(--text-body)}body{padding:20px}
.lbl{font:var(--fw-semibold) var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-feature-settings:var(--font-numeric-feature)}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.wm{font-family:var(--font-display);font-weight:700;letter-spacing:-0.03em;color:var(--text-primary)}
.wm i{font-style:normal;color:var(--sf-amber-500)}
</style></head><body><div style="background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:14px;padding:14px">
<span class="lbl">bg-base #0D1117</span>
<div style="margin-top:10px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:12px;padding:12px;box-shadow:var(--shadow-sm)">
<span class="lbl">surface-card #161B23</span>
<div style="margin-top:10px;background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:10px;padding:12px">
<span class="lbl">surface-raised #1D242E</span>
<div style="margin-top:10px;background:var(--surface-inset);border:1px solid var(--border-default);border-radius:8px;padding:10px"><span class="lbl">surface-inset #12171F — wells, tracks, fields</span></div>
</div></div></div></body></html>
