<!-- @dsCard group="Spacing" viewport="700x190" name="Layout rules" subtitle="20px screen gutter · 16px card padding · 24px between sections · 44px min tap." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-base);color:var(--text-body)}body{padding:20px}
.lbl{font:var(--fw-semibold) var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-feature-settings:var(--font-numeric-feature)}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.wm{font-family:var(--font-display);font-weight:700;letter-spacing:-0.03em;color:var(--text-primary)}
.wm i{font-style:normal;color:var(--sf-amber-500)}
</style></head><body><div style="display:flex;gap:20px;align-items:stretch">
<div style="width:220px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:14px;padding:16px;position:relative">
<div style="position:absolute;inset:0;border-left:20px solid rgba(74,122,158,.14);border-right:20px solid rgba(74,122,158,.14);border-radius:14px;pointer-events:none"></div>
<div class="lbl">Card · 16px inset</div>
<div style="margin-top:24px;height:44px;border-radius:10px;background:var(--action-accent-quiet);border:1px dashed rgba(224,164,88,.5);display:flex;align-items:center;justify-content:center"><span class="mono" style="font-size:11px;color:var(--sf-amber-400)">44px tap target</span></div>
</div>
<div class="col" style="gap:8px;justify-content:center">
<div style="display:flex;gap:10px;align-items:baseline"><span class="mono" style="font-size:11px;color:var(--sf-blue-300);width:120px">--gutter-screen</span><span class="mono" style="font-size:11px;color:var(--text-primary);width:44px">20px</span><span style="font:400 12px/1 var(--font-body);color:var(--text-tertiary)">screen sides</span></div><div style="display:flex;gap:10px;align-items:baseline"><span class="mono" style="font-size:11px;color:var(--sf-blue-300);width:120px">--gutter-card</span><span class="mono" style="font-size:11px;color:var(--text-primary);width:44px">16px</span><span style="font:400 12px/1 var(--font-body);color:var(--text-tertiary)">inside a card</span></div><div style="display:flex;gap:10px;align-items:baseline"><span class="mono" style="font-size:11px;color:var(--sf-blue-300);width:120px">--stack-section</span><span class="mono" style="font-size:11px;color:var(--text-primary);width:44px">24px</span><span style="font:400 12px/1 var(--font-body);color:var(--text-tertiary)">between sections</span></div><div style="display:flex;gap:10px;align-items:baseline"><span class="mono" style="font-size:11px;color:var(--sf-blue-300);width:120px">--tap-min</span><span class="mono" style="font-size:11px;color:var(--text-primary);width:44px">44px</span><span style="font:400 12px/1 var(--font-body);color:var(--text-tertiary)">minimum control</span></div><div style="display:flex;gap:10px;align-items:baseline"><span class="mono" style="font-size:11px;color:var(--sf-blue-300);width:120px">--tabbar-h</span><span class="mono" style="font-size:11px;color:var(--text-primary);width:44px">64px</span><span style="font:400 12px/1 var(--font-body);color:var(--text-tertiary)">bottom nav</span></div><div style="display:flex;gap:10px;align-items:baseline"><span class="mono" style="font-size:11px;color:var(--sf-blue-300);width:120px">--nav-h</span><span class="mono" style="font-size:11px;color:var(--text-primary);width:44px">56px</span><span style="font:400 12px/1 var(--font-body);color:var(--text-tertiary)">top bar</span></div>
</div></div></body></html>
