<!-- @dsCard group="Type" viewport="700x200" name="Metrics — JetBrains Mono" subtitle="Every number the user reads. Tabular figures so digits never jitter." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-base);color:var(--text-body)}body{padding:20px}
.lbl{font:var(--fw-semibold) var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-feature-settings:var(--font-numeric-feature)}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.wm{font-family:var(--font-display);font-weight:700;letter-spacing:-0.03em;color:var(--text-primary)}
.wm i{font-style:normal;color:var(--sf-amber-500)}
</style></head><body><div class="row" style="align-items:flex-end;gap:36px">
<div class="col" style="gap:4px"><span class="lbl">Metric XL 48</span><span class="mono" style="font-size:48px;font-weight:500;letter-spacing:-0.03em;color:var(--text-primary);line-height:1">62</span></div>
<div class="col" style="gap:4px"><span class="lbl">Metric LG 34</span><span class="mono" style="font-size:34px;font-weight:500;letter-spacing:-0.02em;color:var(--text-primary);line-height:1">18,420</span></div>
<div class="col" style="gap:4px"><span class="lbl">Metric MD 24</span><span class="mono" style="font-size:24px;font-weight:500;color:var(--text-primary);line-height:1">82.5</span></div>
<div class="col" style="gap:4px"><span class="lbl">Inline 13</span><span class="mono" style="font-size:13px;color:var(--text-secondary)">4 × 8 · 07:42</span></div>
</div></body></html>
