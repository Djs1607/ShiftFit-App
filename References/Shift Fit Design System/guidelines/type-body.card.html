<!-- @dsCard group="Type" viewport="700x220" name="Body — Inter" subtitle="All prose and UI labels. 15px default, 1.45 leading." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-base);color:var(--text-body)}body{padding:20px}
.lbl{font:var(--fw-semibold) var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary)}
.mono{font-family:var(--font-mono);font-feature-settings:var(--font-numeric-feature)}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;gap:10px}
.wm{font-family:var(--font-display);font-weight:700;letter-spacing:-0.03em;color:var(--text-primary)}
.wm i{font-style:normal;color:var(--sf-amber-500)}
</style></head><body><div class="col" style="gap:14px">
<div style="display:flex;gap:16px;align-items:baseline"><span class="mono" style="font-size:11px;color:var(--text-tertiary);width:58px">16/400</span><span style="font:400 16px/1.5 var(--font-body);color:var(--text-body)">Your readiness dropped 8 points overnight.</span></div>
<div style="display:flex;gap:16px;align-items:baseline"><span class="mono" style="font-size:11px;color:var(--text-tertiary);width:58px">15/400</span><span style="font:400 15px/1.45 var(--font-body);color:var(--text-body)">Body default — sentences, captions, list titles.</span></div>
<div style="display:flex;gap:16px;align-items:baseline"><span class="mono" style="font-size:11px;color:var(--text-tertiary);width:58px">15/500</span><span style="font:500 15px/1.45 var(--font-body);color:var(--text-primary)">Medium: row titles and control labels.</span></div>
<div style="display:flex;gap:16px;align-items:baseline"><span class="mono" style="font-size:11px;color:var(--text-tertiary);width:58px">13/400</span><span style="font:400 13px/1.45 var(--font-body);color:var(--text-secondary)">Small: hints, subtitles, secondary metadata.</span></div>
</div></body></html>
